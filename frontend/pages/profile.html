<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Screen</title>
    <link rel="stylesheet" href="../styles/profile.css" />
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>Account</h1>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Profile Section -->
      <div class="profile-section">
        <div class="profile-icon">
          <img src="../assets/profile.jpg" alt="profile" />
        </div>
        <div class="profile-info">
          <h2>MSN</h2>
          <p>mattaparthisivannarayana@gmail.com</p>
        </div>
        <button class="menu-item">
          <i data-lucide="chevron-left" class="icon rotate"></i>
        </button>
      </div>

      <!-- Menu Items -->
      <div class="menu">
        <button class="menu-item logout">
          <span>Logout</span>
          <i data-lucide="log-out" class="icon"></i>
        </button>
      </div>

      <!-- Logout Confirmation Modal -->
      <div id="logoutModal" class="logout-modal" style="display: none">
        <div class="logout-modal-content">
          <h2 class="logout-title">Logout</h2>
          <hr class="logout-divider" />
          <p class="logout-question">Are you sure you want to log out?</p>
          <div class="logout-actions">
            <button id="cancelLogoutBtn" class="logout-btn cancel">
              Cancel
            </button>
            <button id="confirmLogoutBtn" class="logout-btn confirm">
              Yes Logout
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <div class="bottom-nav">
        <button>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9,22 9,12 15,12 15,22"></polyline>
          </svg>
        </button>
        <button>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2Z"
            ></path>
            <path d="M13 5v2"></path>
            <path d="M13 17v2"></path>
            <path d="M13 11v2"></path>
          </svg>
        </button>
        <button class="account-tab">
          <div class="account-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span>Account</span>
        </button>
      </div>
    </div>

    <script src="../scripts/profile.js"></script>
  </body>
</html>
