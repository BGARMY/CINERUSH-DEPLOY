<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINE RUSH - You're All Set!</title>
    <link rel="stylesheet" href="../styles/signup_success.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Success Icon -->
            <div class="success-icon">
                <div class="phone-container">
                    <div class="phone">
                        <div class="phone-screen"></div>
                        <div class="checkmark">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="text-content">
                <h1 class="title">You're All Set!</h1>
                <p class="subtitle">Start exploring the latest movies showtime, and ticket options.</p>
            </div>
        </div>

        <!-- Action Button -->
        <button class="cta-button" onclick="startWatching()">Let's Start Watching</button>
    </div>

    <script src="../scripts/signup_success.js"></script>
</body>
</html>
