<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Successful - CINE RUSH</title>
    <link rel="stylesheet" href="../styles/booking_successful.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <button class="back-btn" onclick="goBack()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1 class="header-title">Review Your Booking</h1>
      </header>

      <!-- Movie Details -->
      <div class="movie-section">
        <div class="movie-poster" id="moviePoster" aria-label="Movie Poster">
          <img
            class="movie-poster-img"
            src=""
            alt="Movie Poster"
            width="100%"
            height="100%"
            style="border-radius: 16px 16px 0px 0px; object-fit: cover"
          />
        </div>
        <div class="movie-info">
          <h2 class="movie-title" id="movieTitle">Coolie</h2>
          <p class="movie-language" id="movieLanguage">Telugu 2D</p>
          <p class="cinema-name" id="cinemaName">
            Sri Padma Veereswara Complex
          </p>
          <p class="cancellation-info">⊗ Cancellation unavailable</p>
        </div>
      </div>

      <button class="pay-now-btn completed" disabled aria-disabled="true">
        Pay Now &gt;
      </button>

      <!-- Success Animation -->
      <div class="success-section">
        <div class="success-animation">
          <div class="success-circle">
            <div class="success-dots"></div>
            <div class="success-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                <path
                  d="M20 6L9 17L4 12"
                  stroke="white"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
        </div>

        <div class="success-message">
          <h2 class="success-title">Ticket Successfully Booked!</h2>
          <p class="success-subtitle">
            You're all set for an amazing movie Experience!
          </p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="view-ticket-btn" onclick="viewTicket()">
          View My Ticket
        </button>
        <button class="back-home-btn" onclick="goHome()">Back to Home</button>
      </div>

      <!-- Payment Summary (Background) -->
      <div class="payment-summary-bg">
        <div class="summary-row">
          <span>Order amount</span>
          <span>₹100.00</span>
        </div>
        <div class="summary-row">
          <span>Booking charge (inc. of GST)</span>
          <span>₹30.00</span>
        </div>
        <div class="summary-row total-row">
          <span>To be paid</span>
          <span>₹130.00</span>
        </div>
      </div>

      <!-- Payment Method Bar (Background) -->
      <div class="payment-method-bar-bg">
        <div class="payment-info">
          <span class="pay-using">Pay Using</span>
          <span class="payment-method-name">Google Pay UPI</span>
        </div>
        <div class="payment-amount">
          <span class="amount">₹130.00</span>
          <span class="total-label">Total</span>
        </div>
        <button class="pay-now-btn completed">Pay Now ></button>
      </div>
    </div>

    <script src="../scripts/booking_successful.js"></script>
  </body>
</html>
