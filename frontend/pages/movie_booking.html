<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets | CINE RUSH</title>
    <link rel="stylesheet" href="../styles/movie_booking.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="goBack()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="movie-info">
                <h1 class="movie-title"></h1>
                <p class="movie-runtime"></p>
            </div>
        </header>

        <!-- Date Selector (populated dynamically) -->
        <div class="date-selector" id="dateSelector" aria-live="polite">
            <!-- dates will be injected here by JavaScript -->
        </div>

        <!-- Cinema Info -->
        <div class="cinema-section">
            <div class="cinema-info">
                <div class="cinema-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                        <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2"/>
                        <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <div class="cinema-details">
                    <h2 class="cinema-name">Sri Padma Veereswara Complex</h2>
                    <p class="cinema-location">Yanam</p>
                </div>
            </div>
            <p class="cancellation-notice">Cancellation not available</p>
        </div>

        <!-- Showtimes -->
        <div class="showtimes-section">
            <div class="showtime-grid">
                <!-- Showtimes will be generated by JS -->
            </div>
        </div>
    </div>

    <script src="../scripts/movie_booking.js"></script>
</body>
</html>
