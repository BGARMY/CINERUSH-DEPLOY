<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CINE RUSH</title>
    <link rel="stylesheet" href="../styles/signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="form-content">
            <h1 class="title">Create Account</h1>
            <p class="subtitle">Sign up to unlock a world of movies and seamless ticket booking</p>
            
            <form class="signup-form">
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <div class="input-container">
                        <input type="text" id="name" name="name" placeholder="Name" required>
                    </div>
                    <label for="email" class="form-label">Email</label>
                    <div class="input-container">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="22,6 12,13 2,6" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-container">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="#9CA3AF" stroke-width="2"/>
                            <circle cx="12" cy="16" r="1" fill="#9CA3AF"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#9CA3AF" stroke-width="2"/>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="password">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#9CA3AF" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3" stroke="#9CA3AF" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="#9CA3AF" stroke-width="2"/>
                            <circle cx="12" cy="16" r="1" fill="#9CA3AF"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#9CA3AF" stroke-width="2"/>
                        </svg>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-Enter your password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#9CA3AF" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3" stroke="#9CA3AF" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="signin-link">
                    <span>Already have an account? </span>
                    <a href="signin.html" class="link">Sign in</a>
                </div>

                <button type="submit" class="signup-button">Sign up</button>
            </form>
        </div>
    </div>

    <script src="../scripts/signup.js"></script>
</body>
</html>
