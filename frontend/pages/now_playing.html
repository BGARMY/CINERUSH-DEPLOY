<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing - CINE RUSH</title>
    <link rel="stylesheet" href="../styles/now_playing.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="goBack()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1 class="page-title">Now Playing</h1>
        </header>

        <!-- Movies Grid -->
        <div class="movies-grid">
            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/kingdom-et00433664-1753697049.jpg" alt="Kingdom" width="100%" height="100%" class="sc-echj48-5 jNMNoU" style="border-radius: 16px 16px 0px 0px; object-fit: cover;">
                </div>
                <h3 class="movie-title">Kingdom</h3>
                <button class="book-btn" onclick="bookMovie('Kingdom')">Book Now</button>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/war-2-et00356501-1755672553.jpg" alt="War 2" width="100%" height="100%" class="sc-echj48-5 jNMNoU" style="border-radius: 16px 16px 0px 0px; object-fit: cover;">
                </div>
                <h3 class="movie-title">War 2</h3>
                <button class="book-btn" onclick="bookMovie('War 2')">Book Now</button>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/coolie-et00395817-1755153511.jpg" alt="Coolie" width="100%" height="100%" class="sc-echj48-5 jNMNoU" style="border-radius: 16px 16px 0px 0px; object-fit: cover;">
                </div>
                <h3 class="movie-title">Coolie</h3>
                <button class="book-btn" onclick="bookMovie('Coolie')">Book Now</button>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/mirai-et00395402-1757419467.jpg" alt="Mirai" width="100%" height="100%" class="sc-echj48-5 jNMNoU" style="border-radius: 16px 16px 0px 0px; object-fit: cover;">
                </div>
                <h3 class="movie-title">Mirai</h3>
                <button class="book-btn" onclick="bookMovie('Mirai')">Book Now</button>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/little-hearts-et00459285-1756102427.jpg" alt="Little Hearts" width="100%" height="100%" class="sc-echj48-5 jNMNoU" style="border-radius: 16px 16px 0px 0px; object-fit: cover;">
                </div>
                <h3 class="movie-title">Little Hearts</h3>
                <button class="book-btn" onclick="bookMovie('Little Hearts')">Book Now</button>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/demon-slayer--kimetsu-no-yaiba--the-movie-infinity-castle-et00436673-1752221214.jpg" alt="Demon Slayer: Kimetsu no Yaiba Infinity Castle" width="100%" height="100%" class="sc-echj48-5 jNMNoU" style="border-radius: 16px 16px 0px 0px; object-fit: cover;">
                </div>
                <h3 class="movie-title">Demon Slayer</h3>
                <button class="book-btn" onclick="bookMovie('Demon Slayer')">Book Now</button>
            </div>
        </div>
    </div>

    <script src="../scripts/now_playing.js"></script>
</body>
</html>
