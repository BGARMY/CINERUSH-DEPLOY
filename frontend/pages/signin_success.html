<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Successful - CINE RUSH</title>
    <link rel="stylesheet" href="../styles/signin_success.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">Sign In</h1>
            <p class="subtitle">Sign in to unlock a world of movies and seamless ticket booking</p>
            
            <div class="form-section">
                <div class="input-group">
                    <label class="label">Email</label>
                    <div class="input-container">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" fill="none"/>
                            <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <input type="email" placeholder="Email" class="input-field" disabled>
                    </div>
                </div>

                <div class="input-group">
                    <label class="label">Password</label>
                    <div class="input-container">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
                            <circle cx="12" cy="16" r="1" fill="currentColor"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        <input type="password" placeholder="Enter your password" class="input-field" disabled>
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" fill="none"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                </div>

                <!-- Loading Animation -->
                <div class="loading-container">
                    <div class="loading-circle">
                        <div class="loading-dots">
                            <div class="dot dot-1"></div>
                            <div class="dot dot-2"></div>
                            <div class="dot dot-3"></div>
                            <div class="dot dot-4"></div>
                            <div class="dot dot-5"></div>
                            <div class="dot dot-6"></div>
                            <div class="dot dot-7"></div>
                            <div class="dot dot-8"></div>
                        </div>
                        <div class="user-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="success-message">
                    <h2 class="success-title">Sign in Successful!</h2>
                    <p class="wait-text">Please wait...</p>
                    <p class="redirect-text">You will be directed to the homepage.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../scripts/signin_success.js"></script>
</body>
</html>
